<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BUNNY TECH DASHBOARD</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            900: '#14532d',
                            950: '#052e16',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Dashboard = () => {
            const [activeTab, setActiveTab] = useState('home');
            const [menuOpen, setMenuOpen] = useState(false);
            const [stats, setStats] = useState({
                botName: 'Loading...',
                version: '...',
                prefix: '...',
                commandsCount: 0,
                ownerNumber: '...',
                status: 'Connecting...'
            });

            useEffect(() => {
                fetch('/api/stats')
                    .then(res => res.json())
                    .then(data => setStats(data))
                    .catch(err => console.error("Error fetching stats:", err));
                
                const interval = setInterval(() => {
                    fetch('/api/stats')
                        .then(res => res.json())
                        .then(data => setStats(data));
                }, 10000); // refresh every 10s

                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                lucide.createIcons();
            });

            const toggleMenu = () => setMenuOpen(!menuOpen);
            const navTo = (tab) => { setActiveTab(tab); setMenuOpen(false); };

            return (
                <div className="min-h-screen flex flex-col md:flex-row relative">
                    {/* Mobile Header */}
                    <div className="md:hidden flex items-center justify-between p-4 glass-panel sticky top-0 z-50">
                        <div className="flex items-center gap-2">
                            <span className="text-2xl">🐰</span>
                            <h1 className="font-bold text-lg tracking-wider">{stats.botName.toUpperCase()}</h1>
                        </div>
                        <button onClick={toggleMenu} className="p-2 bg-slate-800 rounded-lg border border-slate-700">
                            <i data-lucide={menuOpen ? "x" : "menu"} className="w-6 h-6 text-slate-300"></i>
                        </button>
                    </div>

                    {/* Side Menu (Mobile Drawer & Desktop Sidebar) */}
                    <div className={`fixed inset-y-0 left-0 z-40 w-64 glass-panel transform transition-transform duration-300 ease-in-out md:relative md:translate-x-0 ${menuOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-6 hidden md:flex items-center gap-3 border-b border-slate-700/50">
                            <span className="text-3xl drop-shadow-md">🐰</span>
                            <div>
                                <h1 className="font-bold tracking-widest text-lg">{stats.botName.toUpperCase()}</h1>
                                <span className="text-xs text-brand-500 font-medium">v{stats.version}</span>
                            </div>
                        </div>
                        <nav className="p-4 space-y-2 mt-16 md:mt-0">
                            <button 
                                onClick={() => navTo('home')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activeTab === 'home' ? 'bg-brand-500/20 text-brand-500 border border-brand-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
                            >
                                <i data-lucide="home" className="w-5 h-5"></i>
                                <span className="font-medium">Home</span>
                            </button>
                            <button 
                                onClick={() => navTo('about')}
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all ${activeTab === 'about' ? 'bg-brand-500/20 text-brand-500 border border-brand-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
                            >
                                <i data-lucide="info" className="w-5 h-5"></i>
                                <span className="font-medium">About</span>
                            </button>
                        </nav>
                        
                        <div className="absolute bottom-0 w-full p-6 border-t border-slate-700/50">
                            <div className="flex items-center gap-3">
                                <div className={`w-2.5 h-2.5 rounded-full ${stats.status === 'Online' ? 'bg-brand-500 animate-pulse' : 'bg-red-500'}`}></div>
                                <span className="text-sm font-medium text-slate-300">{stats.status}</span>
                            </div>
                        </div>
                    </div>

                    {/* Overlay for mobile */}
                    {menuOpen && (
                        <div 
                            onClick={toggleMenu} 
                            className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-30 md:hidden"
                        ></div>
                    )}

                    {/* Main Content */}
                    <main className="flex-1 p-4 md:p-8 overflow-y-auto w-full max-w-4xl mx-auto">
                        {activeTab === 'home' ? (
                            <div className="space-y-6 fade-in">
                                <header className="mb-8">
                                    <h2 className="text-2xl md:text-3xl font-bold text-white mb-2">Dashboard</h2>
                                    <p className="text-slate-400">System overview and live statistics.</p>
                                </header>

                                {/* Modern vertical boxes styled like the requested terminal boxes */}
                                <div className="glass-panel rounded-2xl p-6 relative overflow-hidden shadow-2xl">
                                    <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-brand-500 to-emerald-300"></div>
                                    
                                    <div className="flex items-center gap-3 mb-6 pb-4 border-b border-slate-700/50">
                                        <i data-lucide="activity" className="text-brand-500 w-6 h-6"></i>
                                        <h3 className="text-lg font-semibold tracking-wide text-white">SYSTEM STATUS</h3>
                                    </div>

                                    <div className="space-y-4">
                                        <div className="flex justify-between items-center p-3 rounded-lg bg-slate-800/50 border border-slate-700/50">
                                            <span className="text-slate-400 font-medium">Bot Name</span>
                                            <span className="text-white font-bold tracking-wider">{stats.botName}</span>
                                        </div>
                                        <div className="flex justify-between items-center p-3 rounded-lg bg-slate-800/50 border border-slate-700/50">
                                            <span className="text-slate-400 font-medium">Prefix</span>
                                            <span className="bg-slate-700 text-brand-400 px-3 py-1 rounded-md font-mono font-bold">{stats.prefix}</span>
                                        </div>
                                        <div className="flex justify-between items-center p-3 rounded-lg bg-slate-800/50 border border-slate-700/50">
                                            <span className="text-slate-400 font-medium">Total Commands</span>
                                            <span className="text-white font-bold">{stats.commandsCount}</span>
                                        </div>
                                        <div className="flex justify-between items-center p-3 rounded-lg bg-slate-800/50 border border-slate-700/50">
                                            <span className="text-slate-400 font-medium">Owner Number</span>
                                            <span className="text-white font-mono">+{stats.ownerNumber}</span>
                                        </div>
                                        <div className="flex justify-between items-center p-3 rounded-lg bg-slate-800/50 border border-slate-700/50">
                                            <span className="text-slate-400 font-medium">Status</span>
                                            <div className="flex items-center gap-2">
                                                {stats.status === 'Online' ? (
                                                    <span className="px-3 py-1 bg-brand-500/20 text-brand-400 border border-brand-500/30 rounded-full text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                                                        <span className="w-1.5 h-1.5 rounded-full bg-brand-500 animate-pulse"></span>
                                                        Active
                                                    </span>
                                                ) : (
                                                    <span className="px-3 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded-full text-xs font-bold uppercase tracking-wider flex items-center gap-1.5">
                                                        <span className="w-1.5 h-1.5 rounded-full bg-red-500"></span>
                                                        Offline
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div className="mt-8 pt-4 border-t border-slate-700/50 text-center">
                                        <span className="text-xs font-medium text-slate-500 tracking-widest">*{stats.botName.toUpperCase()} ONLINE 🪂*</span>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6 fade-in">
                                <header className="mb-8">
                                    <h2 className="text-2xl md:text-3xl font-bold text-white mb-2">About The Bot</h2>
                                    <p className="text-slate-400">Discover the story behind the automation.</p>
                                </header>

                                <div className="glass-panel rounded-2xl p-6 md:p-8 shadow-2xl relative overflow-hidden">
                                    <div className="absolute -top-24 -right-24 w-48 h-48 bg-brand-500/20 rounded-full blur-3xl"></div>
                                    <div className="absolute -bottom-24 -left-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl"></div>
                                    
                                    <div className="relative z-10 prose prose-invert max-w-none text-slate-300 leading-relaxed space-y-6">
                                        <p className="text-lg md:text-xl font-medium text-white border-l-4 border-brand-500 pl-4">
                                            Forged in the depths of the digital realm, {stats.botName} stands as a silent sentinel over your communications.
                                        </p>
                                        
                                        <p>
                                            In a world overflowing with chaotic messages and endless notifications, <strong>{stats.botName}</strong> brings order. 
                                            It is more than just code; it is a meticulously crafted entity designed to streamline your WhatsApp experience. 
                                            Born from open-source principles and driven by modern engineering, it handles everything from mundane group 
                                            management to complex automations with unwavering reliability.
                                        </p>
                                        
                                        <p>
                                            The framework operates autonomously, ensuring that no message is lost in the void and every command is executed 
                                            with precision. Its ultra-clean architecture guarantees low latency, while the robust anti-delete and status-detection 
                                            systems provide unmatched oversight.
                                        </p>

                                        <p>
                                            As the moon watches the night sky, {stats.botName} watches over your digital domain. It is your shield, 
                                            your automation engine, and your ultimate companion in the vast ecosystem of instant messaging. 
                                        </p>
                                        
                                        <div className="mt-8 pt-6 border-t border-slate-700/50 flex flex-col items-center justify-center space-y-2">
                                            <span className="text-4xl drop-shadow-lg">🐰</span>
                                            <h3 className="text-xl font-bold tracking-widest text-white mt-2">{stats.botName.toUpperCase()}</h3>
                                            <p className="text-sm text-brand-400 font-medium">v{stats.version} — The Ultimate Framework</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
